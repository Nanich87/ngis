# Shared proxy settings for nGIS (included from ngis.conf).
proxy_pass http://127.0.0.1:8000;
proxy_http_version 1.1;
proxy_set_header Host $host;
# Overwrite (do not append to) X-Forwarded-For, so clients cannot inject fake addresses.
# The app trusts this header only from NGIS_TRUSTED_PROXIES (127.0.0.1).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
