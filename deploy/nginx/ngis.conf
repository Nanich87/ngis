# nGIS behind nginx.  Install: see README → "Внедряване в интернет".
#
# Replace gis.example.com with your domain. certbot (--nginx --redirect --hsts) then adds the HTTPS
# server block, the HTTP→HTTPS redirect and Strict-Transport-Security to this file.

# Second line of brute-force defence in front of the app's own limits: 10 login attempts/min per IP.
limit_req_zone $binary_remote_addr zone=ngis_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name gis.example.com;

    server_tokens off;

    # GeoJSON uploads (the app accepts up to 64 MB).
    client_max_body_size 64m;

    # Proxy settings, inherited by both locations below.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite (do not append to) X-Forwarded-For, so clients cannot inject fake addresses.
    # The app trusts this header only from NGIS_TRUSTED_PROXIES (127.0.0.1).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location = /api/auth/login {
        limit_req zone=ngis_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
